// 价格顶底（之字形）：从最近一个极值反转幅度 ≥ 阈值才确认一个顶/底；最后一个尚未确认的极值带问号、灰色
function zigzag(rows, thr) {
  const piv = []; if (rows.length < 3) return piv;
  let trend = null, hi = { i: 0, v: rows[0].high }, lo = { i: 0, v: rows[0].low };
  for (let i = 1; i < rows.length; i++) {

    } else if (trend === "up") {
      if (h > hi.v) hi = { i, v: h };
      if (hi.v / l - 1 >= thr) { piv.push({ t: "顶", ...hi, ok: true }); trend = "down"; lo = { i, v: l }; }
    } else {
      if (l < lo.v) lo = { i, v: l };

// 量价背离：用价格顶底（之字形，已确认的）做比较——相邻两个顶，价格更高而指标更低 = 顶背离；相邻两个底，价格更低而指标更高 = 底背离
// 指标值取转折点前后 3 个交易日内的极值（顶取最大、底取最小），MFI、A/D 线分别比较
function findDivs(m, piv) {
  const near = (map, i, top) => { let v = null;
    for (let j = Math.max(0, i - 3); j <= Math.min(m.prow.length - 1, i + 3); j++) { const x = map.get(m.prow[j].time);

function applyPivots() {

        const dm = { time: t, position: top ? "aboveBar" : "belowBar", shape: "circle", color: "#e040fb", text: `${p.t}背离` };

function tipHtml(e, t) {
  const m = METALS.find(x => x.key === e.metal), dp = 2;
  const head = `<div class="h">${m.name} · ${t} ${wday(t)}</div>`;
  if (e.kind === "p") {
    const r = m.pByDate.get(t); if (!r) return head + row("当日无期货行情", "");
    const chg = (r[4] / r[1] - 1) * 100;
    return head + row("开", fmt(r[1], dp)) + row("高", fmt(r[2], dp)) + row("低", fmt(r[3], dp)) + row("收", `<b>${fmt(r[4], dp)}</b>`) + row("日内涨跌", sgn(chg, 2) + "%");
  }
  const r = m.tByDate.get(t); if (!r) return head + row("当日无持仓量数据", "");
  const b = (k, on) => on ? `<b>${k}</b>` : k;
  let h = head + row(b("总持仓量", e.kind === "o"), `<span class="${e.kind === "o" ? "big" : ""}">${fmt(r.oi)} 手</span>`) +
    row(b("当日变化", e.kind === "c"), `<span class="${e.kind === "c" ? "big" : ""}">${sgn(r.chg)} 手</span>`) +
    row(b("总成交量", e.kind === "v"), `<span class="${e.kind === "v" ? "big" : ""}">${fmt(r.vol)} 手</span>`);
  h += row(b("MFI(14)", e.kind === "b"), `<span class="${e.kind === "b" ? "big" : ""}">${m.mfi.has(t) ? fmt(m.mfi.get(t), 1) : "–"}</span>`);
  h += row(b("A/D 线", e.kind === "a"), `<span class="${e.kind === "a" ? "big" : ""}">${m.ad.has(t) ? fmt(m.ad.get(t)) : "–"}</span>`);
  h += row(b("CMF(20)", e.kind === "f"), `<span class="${e.kind === "f" ? "big" : ""}">${m.cmf.has(t) ? sgn(m.cmf.get(t), 3) : "–"}</span>`);
  h += row("价格涨跌", sgn(m.pChg.get(t), m.key === "gold" ? 1 : 2)) + row("价仓关系", reading(m.pChg.get(t), r.chg));
  return h;
}
function showTip(e, p) {
  const tip = e.tip;
  if (!p.time || !p.point || p.point.x < 0 || p.point.y < 0) { tip.style.display = "none"; return; }
  tip.innerHTML = tipHtml(e, p.time); tip.style.display = "block";
  const W = e.el.clientWidth, H = e.el.clientHeight, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = p.point.x + 18, y = p.point.y - h / 2;
  if (x + w > W - 4) x = p.point.x - w - 18;
  tip.style.left = Math.max(2, x) + "px"; tip.style.top = Math.max(2, Math.min(H - h - 2, y)) + "px";
}
function summary() {
  const [g, v] = METALS, dates = D.gold.total.slice(-30).map(r => r[0]).reverse();
  const cell = (m, d) => { const r = m.tByDate.get(d); return r ? `${fmt(r.oi)}　${sgn(r.chg)}` : "–"; };
  $("sum").innerHTML = `<div class="col" style="grid-column:1/-1"><div class="card"><div class="ttl">近 30 个公报日：总持仓量及当日变化（手，最新在前）与价仓关系</div>
    <table><thead><tr><th>日期</th><th>黄金持仓量　变化</th><th>黄金 价仓关系</th><th>白银持仓量　变化</th><th>白银 价仓关系</th></tr></thead><tbody>` +
    dates.map(d => `<tr><td>${d} ${wday(d)}</td><td>${cell(g, d)}</td><td>${reading(g.pChg.get(d), (g.tByDate.get(d) || {}).chg)}</td><td>${cell(v, d)}</td><td>${reading(v.pChg.get(d), (v.tByDate.get(d) || {}).chg)}</td></tr>`).join("") +
    `</tbody></table></div></div>`;
}
function legend(t) {
  METALS.forEach(m => {
    const rows = D[m.key].total; let r = null;
    if (t) { for (let i = rows.length - 1; i >= 0; i--) if (rows[i][0] <= t) { r = rows[i]; break; } }

    const p = m.pByDate.get(r[0]) || null;
    $("lg_" + m.key).innerHTML = `<span>日期 <b>${r[0]}</b></span><span>持仓量 <b>${fmt(r[2])}</b> 手</span><span>当日变化 <b>${sgn(r[3])}</b></span><span>成交量 <b>${fmt(r[1])}</b></span>` +

  });
}
function bind() {
